services:
  - type: web
    name: verisight
    runtime: docker
    plan: standard
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    renderSubdomainPolicy: enabled
    numInstances: 1
    envVars:
      - key: ENABLE_ML
        value: "true"
      - key: DETECTOR_MODEL
        value: prithivMLmods/deepfake-detector-model-v1
      - key: MODEL_LOCAL_FILES_ONLY
        value: "false"
      - key: HF_HOME
        value: /var/data/huggingface
      - key: STATIC_DIR
        value: /app/dist
      - key: MAX_IMAGE_MB
        value: "25"
      - key: MAX_VIDEO_MB
        value: "150"
      - key: MAX_VIDEO_FRAMES
        value: "14"
      - key: VIDEO_SAMPLE_SECONDS
        value: "2.5"
      - key: MAX_ANALYSIS_DIM
        value: "1280"
      - key: MAX_VIDEO_ANALYSIS_DIM
        value: "900"
      - key: MODEL_VIDEO_FRAMES
        value: "6"
      - key: ANALYSIS_CONCURRENCY
        value: "1"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
    disk:
      name: huggingface-cache
      mountPath: /var/data
      sizeGB: 5
