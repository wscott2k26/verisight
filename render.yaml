services:
  - type: web
    name: verisight
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    renderSubdomainPolicy: enabled
    numInstances: 1
    envVars:
      - key: ENABLE_ML
        value: "false"
      - key: STATIC_DIR
        value: /app/dist
      - key: MAX_IMAGE_MB
        value: "15"
      - key: MAX_VIDEO_MB
        value: "50"
      - key: MAX_VIDEO_FRAMES
        value: "8"
      - key: VIDEO_SAMPLE_SECONDS
        value: "3.5"
      - key: MAX_ANALYSIS_DIM
        value: "900"
      - key: MAX_VIDEO_ANALYSIS_DIM
        value: "640"
      - key: MODEL_VIDEO_FRAMES
        value: "0"
      - key: ANALYSIS_CONCURRENCY
        value: "1"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
